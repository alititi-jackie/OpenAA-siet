<!-- Google Search -->
<section class="search-section">
  <form class="search-wrapper" action="https://www.google.com/search" method="GET" target="_self" rel="noopener" onsubmit="return handleGoogleSearchSubmit(event)">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="search"
      id="searchInput"
      name="q"
      class="search-input"
      placeholder="华人OpenAA 搜索你感兴趣的内容..."
      autocomplete="off"
    />
    <button class="search-clear" id="searchClear" type="button" onclick="clearGoogleSearch()" aria-label="清除搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="search-submit" type="submit" aria-label="搜索">搜索</button>
  </form>
</section>
