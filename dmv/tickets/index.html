<script>

// Function to handle ticket queries
function handleQuery(event) {
    event.preventDefault();
    // Validate plate and state
    const plate = document.getElementById('plateInput').value;
    const state = document.getElementById('stateSelect').value;
    if (!validatePlate(plate) || !state) {
        alert('Please enter a valid plate and select a state.');
        return;
    }

    // Show result area
    document.getElementById('resultArea').style.display = 'block';

    // Populate official links based on state
    const officialLinks = document.querySelectorAll('.state-ticket-item');
    officialLinks.forEach(link => {
        if (link.dataset.state === state) {
            document.getElementById('officialLinks').innerHTML += `<a href="${link.href}">${link.innerText}</a>`;
        }
    });

    // Scroll to result area
    document.getElementById('resultArea').scrollIntoView();
}
