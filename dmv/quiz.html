<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0046a0" />
  <title>Quiz — NY DMV Permit Practice | OpenAA</title>
  <link rel="icon" type="image/png" href="../favicon/favicon-32x32.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-top">
      <a class="logo-link" href="../index.html" title="OpenAA Home">
        <img class="logo-img" src="../logo.png" alt="OpenAA Logo" />
      </a>
      <div class="header-subtitle">NY DMV Permit Practice</div>

      <!-- Timer badge -->
      <div class="timer-badge hidden" id="timerBadge">
        ⏱ <span id="timerDisplay">30:00</span>
      </div>
    </div>

    <!-- Progress bar in header -->
    <div>
      <div class="progress-bar-wrap" style="margin-bottom:4px;">
        <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="progress-label" id="progressLabel">
        <span>Question 1 / 20</span><span>0%</span>
      </div>
    </div>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="page-wrap" style="padding-top:16px;">

  <div class="card">
    <!-- Question number -->
    <div class="question-number" id="questionNum">Question 1</div>
    <!-- Question text -->
    <p class="question-text" id="questionText">Loading question…</p>
    <hr class="divider" style="margin-bottom:16px;" />
    <!-- Options -->
    <ul class="options-list" id="optionsList" role="radiogroup" aria-label="Answer options"></ul>
  </div>

  <!-- Navigation -->
  <div class="quiz-nav">
    <button class="btn btn-ghost" id="prevBtn" disabled>← Prev</button>
    <button class="btn btn-outline" id="nextBtn">Next →</button>
    <button class="btn btn-success hidden" id="submitBtn">Submit ✓</button>
  </div>

  <!-- Exit link -->
  <div class="text-center mt-12">
    <button class="btn btn-ghost btn-sm" id="exitBtn">✕ Exit Quiz</button>
  </div>

  <!-- Keyboard hint -->
  <p class="text-muted text-center" style="font-size:.72rem;margin-top:12px;">
    Tip: Use ← → keys to navigate, 1–4 keys to select an option
  </p>

</main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <p>Non-official practice test based on NY DMV Driver's Manual. For study use only.</p>
</footer>

<script src="assets/app.js"></script>
</body>
</html>
