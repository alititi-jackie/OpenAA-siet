<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amani.love</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
color:white;
}

/* 蓝色光圈 */

.ring{
position:absolute;
top:50%;
left:50%;
width:300px;
height:300px;
border-radius:50%;
transform:translate(-50%,-50%);
border:2px solid rgba(0,150,255,0.8);
box-shadow:
0 0 20px rgba(0,150,255,0.8),
0 0 60px rgba(0,150,255,0.6),
0 0 120px rgba(0,150,255,0.4);

animation:spin 6s linear infinite;
}

/* 旋转动画 */

@keyframes spin{
0%{transform:translate(-50%,-50%) rotate(0deg);}
100%{transform:translate(-50%,-50%) rotate(360deg);}
}

/* 标题 */

.title{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:48px;
letter-spacing:6px;
opacity:0;
animation:fadein 3s forwards;
animation-delay:1s;
}

/* 淡入 */

@keyframes fadein{
0%{opacity:0;transform:translate(-50%,-40%);}
100%{opacity:1;transform:translate(-50%,-50%);}
}

/* 视频 */

#video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
display:none;
}

</style>
</head>

<body>

<div class="ring"></div>

<div class="title">Amani.love</div>

<iframe
id="video"
src="https://www.youtube.com/embed/18X0H9hG6Sg?autoplay=1&mute=1&loop=1&playlist=18X0H9hG6Sg"
allow="autoplay"
allowfullscreen>
</iframe>

<script>

/* 5秒后播放视频 */

setTimeout(function(){

document.querySelector(".ring").style.display="none";
document.querySelector(".title").style.display="none";
document.getElementById("video").style.display="block";

},5000);

</script>

</body>
</html>
