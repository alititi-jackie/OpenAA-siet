<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amani.love</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
color:white;
}

/* 星空 */

.stars{
position:fixed;
width:100%;
height:100%;
background:url("https://raw.githubusercontent.com/VincentGarreau/particles.js/master/demo/media/star.png");
animation:starsMove 120s linear infinite;
opacity:0.4;
}

@keyframes starsMove{
from{background-position:0 0;}
to{background-position:10000px 5000px;}
}

/* 能量光圈 */

.ring{
position:absolute;
top:50%;
left:50%;
width:350px;
height:350px;
border-radius:50%;
transform:translate(-50%,-50%);
border:2px solid rgba(0,180,255,0.9);

box-shadow:
0 0 20px rgba(0,180,255,0.9),
0 0 60px rgba(0,180,255,0.6),
0 0 140px rgba(0,180,255,0.4);

animation:spin 8s linear infinite;
}

@keyframes spin{
0%{transform:translate(-50%,-50%) rotate(0deg);}
100%{transform:translate(-50%,-50%) rotate(360deg);}
}

/* 标题 */

.title{

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:60px;
letter-spacing:8px;

background:linear-gradient(90deg,#fff,#9be7ff,#fff);
-webkit-background-clip:text;
color:transparent;

text-shadow:
0 0 10px rgba(255,255,255,0.8),
0 0 30px rgba(0,180,255,0.8),
0 0 60px rgba(0,180,255,0.8);

opacity:0;
animation:fadein 4s forwards;
}

@keyframes fadein{

0%{opacity:0; transform:translate(-50%,-40%);}
100%{opacity:1; transform:translate(-50%,-50%);}

}

/* 视频 */

#video{

position:fixed;
top:0;
left:0;
width:100%;
height:100%;
border:none;
display:none;

}

/* 顶部导航栏 */

.nav-bar{
position:fixed;
top:0;
left:0;
right:0;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
z-index:1000;
background:linear-gradient(180deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
}

/* Logo */

.logo{
font-size:24px;
font-weight:bold;
letter-spacing:4px;
background:linear-gradient(90deg,#fff,#9be7ff,#fff);
-webkit-background-clip:text;
color:transparent;
cursor:pointer;
transition:opacity 0.3s;
}

.logo:hover{
opacity:0.7;
}

/* 返回按钮 */

.back-btn{
padding:10px 20px;
background:rgba(0,180,255,0.2);
border:1px solid rgba(0,180,255,0.8);
color:#9be7ff;
border-radius:5px;
cursor:pointer;
font-size:14px;
transition:all 0.3s;
text-decoration:none;
}

.back-btn:hover{
background:rgba(0,180,255,0.4);
box-shadow:0 0 15px rgba(0,180,255,0.6);
}

/* 底部版权信息 */

.footer{
position:fixed;
bottom:0;
left:0;
right:0;
height:50px;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,0.7));
font-size:12px;
color:rgba(255,255,255,0.6);
z-index:1000;
}

.footer a{
color:rgba(0,180,255,0.8);
text-decoration:none;
transition:color 0.3s;
}

.footer a:hover{
color:#9be7ff;
}

</style>
</head>

<body>

<div class="stars"></div>

<div class="ring"></div>

<div class="title">Amani.love</div>

<!-- 顶部导航栏 -->
<div class="nav-bar">
  <div class="logo" onclick="location.reload()">Amani.love</div>
  <a href="https://openaa.com" class="back-btn">返回 OpenAA 首页</a>
</div>

<!-- 底部版权信息 -->
<div class="footer">
  © 2025 OpenAA.com 保留所有权利 | 联系邮箱：<a href="mailto:323748@gmail.com">323748@gmail.com</a>
</div>

<iframe
id="video"
src="https://www.youtube.com/watch?v=9UZhX3K0o0Q&list=RD9UZhX3K0o0Q&start_radio=1"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

<script>

setTimeout(function(){

document.querySelector(".ring").style.display="none";
document.querySelector(".title").style.display="none";

document.getElementById("video").style.display="block";

},6000);

</script>

</body>
</html>
