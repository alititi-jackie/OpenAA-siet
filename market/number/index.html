<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>美国手机靓号市场</title>
  <style>
    body { font-family: 'Segoe UI',sans-serif; background:#f7fafe;}
    .search-box {text-align:center; margin:24px 0;}
    .search-input {
      padding:10px 20px; font-size:18px; border-radius:20px; border:1px solid #d0d5db; box-shadow:0 1px 8px #d0e6fd44;
      width:90vw;max-width:350px;outline:none;
    }
    .numbers {display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;max-width:900px;margin:20px auto;}
    .number-card {
      background:#fff;border-radius:14px;box-shadow:0 2px 16px #599ef415;padding:18px;text-align:center;
      position:relative;transition:all .15s;cursor:pointer;
    }
    .number-value {font-size:1.15rem;letter-spacing:2px;font-weight:bold;color:#2580e8;word-break:break-all;}
    .number-price {margin-top:6px;color:#099a1f;font-weight:700;}
    .number-card.sold {opacity:.6;pointer-events:none;background:#f4f4f7;}
    .number-badge {position:absolute;top:8px;right:12px;padding:3px 8px;font-size:12px;border-radius:14px;color:#fff;}
    .badge-hot {background:#fe5050;}
    .badge-sold {background:#bcbcbc;}
    /* 响应式 */
    @media (max-width: 700px) {.numbers{grid-template-columns:repeat(2,1fr);}}
    @media (max-width: 430px) {.numbers{grid-template-columns:1fr;}}
  </style>
</head>
<body>
  <div class="search-box">
    <input class="search-input" id="search" type="search" inputmode="numeric" placeholder="输入号码/片段/区号,如 9111 或 917"/>
  </div>
  <div class="numbers" id="numbers"></div>
  <script>
    let rawData = [];
    const norm = s => s.replace(/[^\d]/g,''); // 去除所有非数字
    function render(list, kw = '') {
      const numbers = document.getElementById('numbers');
      if (!list.length) {
        numbers.innerHTML = `<div style="color:#888;font-size:20px;text-align:center;width:100%">无匹配号码</div>`;
        return;
      }
      numbers.innerHTML = list.map(it=>{
        let n = it.number;
        if (n.length===10) n = `(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}`;
        // 高亮匹配片段
        let nv = n, re = '';
        if (kw && (re=new RegExp(kw.replace(/[\[\]{}()*+?.\\^$|]/g,'\\$&'),'gi')))
          nv = n.replace(re, m=>`<mark style="background:#f9e87c;">${m}</mark>`);
        let badge='';
        if (it.hot) badge=`<span class="number-badge badge-hot">热卖</span>`;
        if (it.sold) badge=`<span class="number-badge badge-sold">已售</span>`;
        return `<div class="number-card${it.sold?' sold':''}" onclick="alert('请联系微信 hola24 或电话 19178426666 购买')">
          ${badge}
          <div class="number-value">${nv}</div>
          <div class="number-price">${it.sold?'已售出':(it.price?`$${it.price}`:'咨询')}</div>
        </div>`;
      }).join('');
    }
    fetch('numbers.json').then(r=>r.json()).then(data=>{
      rawData = data;
      render(rawData);
      // 智能搜索
      search.addEventListener('input', function(){
        const kw = norm(this.value);
        if (!kw) return render(rawData);
        const f = rawData.filter(it=>norm(it.number).includes(kw));
        render(f, kw);
      });
    });
    // 自动聚焦
    window.onload = () => { setTimeout(()=>search.focus(),150); }
  </script>
</body>
</html>
