<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 你的 head 标签全保留不变（省略，详见上方你的内容） -->
  ...
  <script src="numbers.js"></script>
  <style>
    /* 你全部原样式全保留 */
  </style>
</head>
<body>
  <!-- Header 及说明全部照抄你的即可 -->

  <header>...如你原内容...</header>
  <div class="breadcrumb">...如你原内容...</div>
  <main>
    <h1>💎 美国手机靓号出售</h1>
    ...联系卡片等也不动...

    <!-- 三连号分区结构（只留每个分区的挂载点） -->
    <h2>🔥 纽约三连号</h2>
    <div class="card" id="triple">
      <div class="card-header">
        <div class="card-header-icon">🔥</div>
        <h3 class="card-header-title">三位数重复</h3>
      </div>
      <div class="card-content">
        <div class="number-grid" id="triple-numbers"></div>
      </div>
    </div>
    <!-- 四连号 -->
    <h2>💎 纽约四连号</h2>
    <div class="card" id="quad">
      <div class="card-header">
        <div class="card-header-icon">💎</div>
        <h3 class="card-header-title">四位数重复</h3>
      </div>
      <div class="card-content">
        <div class="number-grid" id="quad-numbers"></div>
      </div>
    </div>
    <!-- 其他 -->
    <h2>⭐ 其他靓号</h2>
    <div class="card" id="other">
      <div class="card-header">
        <div class="card-header-icon">⭐</div>
        <h3 class="card-header-title">生日号/豹子号/顺号</h3>
      </div>
      <div class="card-content">
        <div class="number-grid" id="other-numbers"></div>
      </div>
    </div>

    <!-- 说明文本/浮动按钮/底部等保持原样，不再罗列 -->
  </main>

  <!-- 其它 footer/modal、脚本全部不动 -->

  <script>
    // --- 动态渲染所有号码 ---
    // numbersData 在 numbers.js 里定义

    // 辅助：格式化XXXYYYZZZZ为 (XXX) YYY-ZZZZ
    function formatNumber(n) {
      n = String(n).replace(/[^\d]/g,'');
      return n.length===10 ? `(${n.slice(0,3)}) ${n.slice(3,6)}-${n.slice(6)}` : n;
    }

    // 卡片DOM
    function renderCard(it) {
      return `<div class="number-item${it.sold ? ' sold' : ''}" onclick="handleNumberClick('${formatNumber(it.number)}')">
        ${it.hot ? '<span class="number-badge badge-hot">热卖</span>' : ''}
        ${it.sold ? '<span class="number-badge badge-sold">已售</span>' : ''}
        <div class="number-value">${formatNumber(it.number)}</div>
        <div class="number-price">${it.sold ? '已售出' : (it.price ? ('$'+it.price) : '咨询')}</div>
      </div>`;
    }

    // 搜索、全分区渲染
    function renderAll(searchKW = '') {
      // 标准化匹配
      const norm = s => s.replace(/[^\d]/g, '');
      // 遍历所有分区
      ['triple','quad','other'].forEach(group=>{
        const grid = document.getElementById(group+'-numbers');
        let arr = numbersData[group] || [];
        let html = '';
        let kw = norm(searchKW||'');
        if (kw) arr = arr.filter(it=>norm(it.number).includes(kw));
        html = arr.length ? arr.map(renderCard).join('') : "<div style='color:#bbb;padding:20px;text-align:center;'>无匹配号码</div>";
        grid.innerHTML = html;
      });
    }

    // 搜索栏事件
    document.getElementById('searchInput').addEventListener('input', function(){
      renderAll(this.value);
    });
    // 初始渲染
    window.onload = function() { renderAll(); }
    // 保持你原有 handleNumberClick 逻辑
  </script>

<!-- 你的其它脚本和 footer 继续保持原样 -->
</body>
</html>
