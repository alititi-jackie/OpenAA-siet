<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Phone Number Search</title>
    <style>
        /* Existing styles here */
    </style>
</head>
<body>
    <div class="search-container">
        <input type="text" id="phone-search" placeholder="Search phone numbers..." oninput="filterNumbers()">
    </div>
    <div class="number-cards">
        <h2>三连号</h2>
        <div id="sanlianhao" class="number-list">
            <!-- Existing number cards here -->
        </div>
        <div class="no-results" id="sanlianhao-no-results" style="display:none;">No results found in 三连号.</div>
    </div>
    <div class="number-cards">
        <h2>四连号</h2>
        <div id="silianhao" class="number-list">
            <!-- Existing number cards here -->
        </div>
        <div class="no-results" id="silianhao-no-results" style="display:none;">No results found in 四连号.</div>
    </div>
    <div class="number-cards">
        <h2>其他靓号</h2>
        <div id="qita" class="number-list">
            <!-- Existing number cards here -->
        </div>
        <div class="no-results" id="qita-no-results" style="display:none;">No results found in 其他靓号.</div>
    </div>
    <script>
        function filterNumbers() {
            const searchValue = document.getElementById('phone-search').value.replace(/[\s\-()]/g, '');
            const sections = ['sanlianhao', 'silianhao', 'qita'];

            sections.forEach(section => {
                const cards = document.querySelectorAll(`#${section} .number-card`);
                let found = false;

                cards.forEach(card => {
                    const numberText = card.innerText.replace(/[\s\-()]/g, '');
                    if (numberText.includes(searchValue)) {
                        card.style.display = 'block';
                        found = true;
                    } else {
                        card.style.display = 'none';
                    }
                });

                document.getElementById(`${section}-no-results`).style.display = found ? 'none' : 'block';
            });
        }
    </script>
</body>
</html>
