<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>添加 OpenAA.app 到桌面</title>
  <meta name="description" content="添加 OpenAA 到手机或电脑桌面，像 App 一样快速打开。" />
  <meta name="theme-color" content="#2563eb" />

  <!-- 必须放在 openaa.com 根目录：/manifest.json -->
  <link rel="manifest" href="/manifest.json" />

  <!-- iPhone 添加到主屏幕 -->
  <link rel="apple-touch-icon" href="https://img.openaa.com/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OpenAA" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
        "Microsoft YaHei", Arial, sans-serif;
      color: #111827;
      background:
        radial-gradient(circle at top left, rgba(37, 99, 235, 0.15), transparent 32%),
        radial-gradient(circle at top right, rgba(22, 163, 74, 0.12), transparent 30%),
        #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .card {
      width: min(100%, 720px);
      background: linear-gradient(135deg, #ffffff 0%, #eef5ff 100%);
      border: 1px solid rgba(37, 99, 235, 0.14);
      border-radius: 30px;
      padding: 34px 18px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 16px;
      border-radius: 26px;
      background: #fff;
      object-fit: contain;
      padding: 10px;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.18);
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    .desc {
      margin: 12px auto 0;
      max-width: 560px;
      color: #5b6472;
      font-size: 16px;
      line-height: 1.7;
    }

    .actions {
      margin: 28px auto 0;
      max-width: 460px;
      display: grid;
      gap: 12px;
    }

    button, a {
      width: 100%;
      border-radius: 18px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 750;
      text-decoration: none;
      border: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .install {
      background: #2563eb;
      color: white;
      box-shadow: 0 12px 26px rgba(37, 99, 235, 0.25);
    }

    .enter {
      background: white;
      color: #2563eb;
      border: 1px solid rgba(37, 99, 235, 0.22);
    }

    .tips {
      display: none;
      margin: 18px auto 0;
      max-width: 560px;
      text-align: left;
      background: #fff7ed;
      color: #9a3412;
      border: 1px solid #fed7aa;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.7;
    }

    .tips.show { display: block; }

    .tips strong { color: #7c2d12; }

    .success {
      display: none;
      margin: 18px auto 0;
      max-width: 560px;
      background: #ecfdf5;
      color: #166534;
      border: 1px solid #bbf7d0;
      border-radius: 18px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.7;
    }

    .success.show { display: block; }

    @media (max-width: 520px) {
      body { align-items: flex-start; padding-top: 36px; }
      .card { border-radius: 26px; padding: 28px 14px; }
      button, a { font-size: 16px; }
    }
  </style>
</head>

<body>
  <main class="card">
    <img class="logo" src="https://img.openaa.com/logo.png" alt="OpenAA Logo" />

    <h1>添加 OpenAA.app 到桌面</h1>
    <p class="desc">
      点击下方按钮，把 OpenAA 添加到手机或电脑桌面。安装后桌面图标打开的是 <strong>openaa.com</strong>。
    </p>

    <div class="actions">
      <button id="installBtn" class="install" type="button">📱 添加 OpenAA 到桌面</button>
      <a class="enter" href="https://ny.openaa.com/">🌐 进入 OpenAA 纽约站</a>
    </div>

    <div id="success" class="success">
      ✅ OpenAA 已经以桌面 App 方式打开，说明你已经添加过了。
    </div>

    <div id="tips" class="tips">
      <strong>当前浏览器不能直接弹出安装窗口，请按下面方法添加：</strong><br><br>
      iPhone：用 Safari 打开本页 → 点分享按钮 → 添加到主屏幕。<br>
      Android：用 Chrome 打开本页 → 点右上角菜单 → 安装应用 / 添加到主屏幕。<br>
      电脑：用 Chrome 或 Edge 打开本页 → 点地址栏右侧安装图标。
    </div>
  </main>

  <script>
    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    const tips = document.getElementById("tips");
    const success = document.getElementById("success");

    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (isStandalone) {
      installBtn.textContent = "✅ 已经添加 OpenAA";
      installBtn.disabled = true;
      success.classList.add("show");
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      tips.classList.remove("show");
    });

    window.addEventListener("appinstalled", () => {
      installBtn.textContent = "✅ 已经添加 OpenAA";
      installBtn.disabled = true;
      tips.classList.remove("show");
      success.classList.add("show");
    });

    installBtn.addEventListener("click", async () => {
      if (isStandalone) {
        success.classList.add("show");
        return;
      }

      if (deferredPrompt) {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;

        if (choice && choice.outcome === "accepted") {
          installBtn.textContent = "✅ 已经添加 OpenAA";
          installBtn.disabled = true;
          success.classList.add("show");
          tips.classList.remove("show");
        } else {
          tips.classList.add("show");
        }
        return;
      }

      tips.classList.add("show");
    });
  </script>
</body>
</html>
