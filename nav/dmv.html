    /* DMV 页面内容专属样式（结构/布局/颜色由 style.css 提供） */
    :root {
      --primary: #0078d4;
      --primary-dark: #005fa3;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    .grid-menu-section { display: none !important; }

    h1 {
      font-size: 24px;
      margin: 16px 0 8px 0;
      color: var(--text-dark);
    }

    h2 {
      font-size: 18px;
      margin: 20px 0 12px 0;
      color: var(--text-dark);
      font-weight: 600;
    }

    .page-desc {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 8px 0;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #f0f7ff 0%, #f8fbff 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header-icon { font-size: 20px; }

    .card-header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
    }

    .card-header-count {
      margin-left: auto;
      font-size: 12px;
      background: var(--primary);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .card-content { padding: 0; }

    .dmv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }

    .dmv-item {
      padding: 12px 16px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .dmv-item:nth-child(2n) { border-right: none; }
    .dmv-item:nth-last-child(-n+2) { border-bottom: none; }
    .dmv-item:active { background: #f0f7ff; }

    .dmv-icon { font-size: 18px; min-width: 18px; }

    .hot-states { background: var(--card-bg); padding: 0; }

    .hot-state-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hot-state-item:last-child { border-bottom: none; }
    .hot-state-item:active { background: #f0f7ff; }

    .dmv-body { padding: 8px; }

    @media (min-width: 560px) {
      .dmv-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
