  <script>
    // Sticky category bar: stick only after scrolling to bar (not always on top)
    (function () {
      var spacer = document.querySelector('.oaa-catbar-spacer');
      if (!spacer) return;

      var wrap = null;
      var header = null;
      var headerH = 56;
      var wrapInitialTop = null; // document Y where wrap starts

      function compute() {
        wrap = document.getElementById('categoryBarWrap');
        header = document.getElementById('appHeader');
        headerH = header ? header.offsetHeight : 56;
        if (!wrap) return false;
        wrapInitialTop = window.scrollY + wrap.getBoundingClientRect().top;
        return true;
      }

      function apply() {
        if (!wrap || wrapInitialTop == null) return;
        var shouldStick = window.scrollY >= (wrapInitialTop - headerH);

        if (shouldStick) {
          if (!wrap.classList.contains('oaa-stuck')) {
            wrap.classList.add('oaa-stuck');
            spacer.classList.add('oaa-on');
          }
        } else {
          if (wrap.classList.contains('oaa-stuck')) {
            wrap.classList.remove('oaa-stuck');
            spacer.classList.remove('oaa-on');
          }
        }
      }

      function init() {
        // include.js injects the category bar asynchronously; retry a few times.
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          if (compute()) {
            clearInterval(timer);
            apply();
            window.addEventListener('scroll', apply, { passive: true });
            window.addEventListener('resize', function () {
              compute();
              apply();
            });
          } else if (tries >= 20) {
            clearInterval(timer);
          }
        }, 80);
      }

      init();
    })();
  </script>
