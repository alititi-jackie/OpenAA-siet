      align-items: center;
      gap: 6px;

      text-align: center;
      min-height: 100px;
      justify-content: center;
    }

    .ai-item:nth-child(3n) { border-right: none; }
    .ai-item:nth-last-child(-n+3) { border-bottom: none; }
    .ai-item:active { background: #f0f7ff; }

    .ai-icon { font-size: 32px; }

    .ai-name {

      font-weight: 600;
      line-height: 1.3;
    }

    /* 链接网格 */

    }

      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;

    }

    .link-item:nth-last-child(-n+2) { border-bottom: none; }
    .link-item:active { background: #f0f7ff; }

    /* 吐司提示 */
    .toast {

      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;

      font-size: 14px;
      z-index: 400;
      animation: slideInUp 0.3s;

    .toast.show { display: block; }

    @keyframes slideInUp {

  <script>
    // Sticky category bar: stick only after scrolling to bar (not always on top)
    (function () {
      var spacer = document.querySelector('.oaa-catbar-spacer');
      if (!spacer) return;

      var wrap = null;
      var header = null;
      var headerH = 56;
      var wrapInitialTop = null; // document Y where wrap starts

      function compute() {
        wrap = document.getElementById('categoryBarWrap');
        header = document.getElementById('appHeader');
        headerH = header ? header.offsetHeight : 56;
        if (!wrap) return false;
        wrapInitialTop = window.scrollY + wrap.getBoundingClientRect().top;
        return true;
      }

      function apply() {
        if (!wrap || wrapInitialTop == null) return;
        var shouldStick = window.scrollY >= (wrapInitialTop - headerH);

        if (shouldStick) {
          if (!wrap.classList.contains('oaa-stuck')) {
            wrap.classList.add('oaa-stuck');
            spacer.classList.add('oaa-on');
          }
        } else {
          if (wrap.classList.contains('oaa-stuck')) {
            wrap.classList.remove('oaa-stuck');
            spacer.classList.remove('oaa-on');
          }
        }
      }

      function init() {
        // include.js injects the category bar asynchronously; retry a few times.
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          if (compute()) {
            clearInterval(timer);
            apply();
            window.addEventListener('scroll', apply, { passive: true });
            window.addEventListener('resize', function () {
              compute();
              apply();
            });
          } else if (tries >= 20) {
            clearInterval(timer);
          }
        }, 80);
      }

      init();
    })();

    // Keep existing stubs to avoid errors if old handlers referenced

  </script>
