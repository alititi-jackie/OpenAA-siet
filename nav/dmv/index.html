  <link rel="stylesheet" href="/subpages-assets/css/style.css" />

  <style>
    /* DMV 页面内容专属样式 */
    :root {
      --primary: #0078d4;
      --card-bg: #ffffff;
      --text-dark: #1f2937;
      --text-light: #6b7280;
      --border: #e5e7eb;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --radius: 12px;
    }

    /* DMV 页面隐藏 8 宫格 */
    .grid-menu-section { display: none !important; }

    h1 {
      font-size: 24px;
      margin: 16px 0 8px 0;
      color: var(--text-dark);
    }

    h2 {
      font-size: 18px;
      margin: 20px 0 12px 0;
      color: var(--text-dark);
      font-weight: 600;
    }

    .page-desc {
      font-size: 14px;
      color: var(--text-light);
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin: 8px 0;
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      background: linear-gradient(135deg, #f0f7ff 0%, #f8fbff 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header-icon { font-size: 20px; }

    .card-header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary);
      margin: 0;
    }

    .card-header-count {
      margin-left: auto;
      font-size: 12px;
      background: var(--primary);
      color: white;
      padding: 4px 8px;
      border-radius: 12px;
    }

    .dmv-body { padding: 8px; }

    .dmv-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
    }

    .dmv-item {
      padding: 12px 16px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .dmv-item:nth-child(2n) { border-right: none; }
    .dmv-item:active { background: #f0f7ff; }

    .dmv-icon { font-size: 18px; min-width: 18px; }

    .hot-states { background: var(--card-bg); padding: 0; }

    .hot-state-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: var(--primary);
      font-size: 14px;
      font-weight: 500;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hot-state-item:last-child { border-bottom: none; }
    .hot-state-item:active { background: #f0f7ff; }

    @media (min-width: 560px) {
      .dmv-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <!-- Injected header -->
  <div data-include="site-header"></div>

  <main class="main-content">
    <!-- Composable inner blocks -->
    <div data-include="inner/banner"></div>
    <div data-include="inner/search"></div>
    <div data-include="inner/category-bar"
         data-cat-active="dmv_official"
         data-cat-config="/subpages-assets/config/categorybar.dmv.json"></div>

    <div class="dmv-body">
      <h1>🚗 美国各州DMV导航</h1>
      <p class="page-desc">为在美华人提供美国50州车辆管理局（DMV）官方网站直链，快速办理驾驶证、车辆登记、路试预约等事务。</p>

      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">🔧</div>
          <h3 class="card-header-title">DMV实用工具</h3>
        </div>
        <div class="card-content">
          <div class="hot-states">
            <a href="https://openaa.com/dmv/tickets/" class="hot-state-item"><span>🚔</span> 停车/闯红灯/超速拍照罚单查询（全美国）</a>
            <a href="https://openaa.com/dmv/ny/practice/" class="hot-state-item"><span>📝</span> 纽约州 DMV 笔试练习</a>
          </div>
        </div>
      </div>

      <h2>热门州DMV</h2>
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">⭐</div>
          <h3 class="card-header-title">华人聚集州</h3>
          <div class="card-header-count">5</div>
        </div>
        <div class="card-content">
          <div class="hot-states">
            <a href="https://dmv.ny.gov/" target="_blank" rel="noopener" class="hot-state-item"><span>🗽</span> 纽约州 New York DMV</a>
            <a href="https://www.dmv.ca.gov/" target="_blank" rel="noopener" class="hot-state-item"><span>☀️</span> 加利福尼亚州 California DMV</a>
            <a href="https://www.txdmv.gov/" target="_blank" rel="noopener" class="hot-state-item"><span>⭐</span> 德克萨斯州 Texas DMV</a>
            <a href="https://www.flhsmv.gov/" target="_blank" rel="noopener" class="hot-state-item"><span>🌴</span> 佛罗里达州 Florida DMV</a>
            <a href="https://dds.georgia.gov/" target="_blank" rel="noopener" class="hot-state-item"><span>🍑</span> 佐治亚州 Georgia DMV</a>
          </div>
        </div>
      </div>

      <!-- (其余 DMV 内容保持不变：你后续可以继续拆分成数据驱动) -->
    </div>
  </main>

  <div data-include="site-bottom-nav"></div>

  <script src="/subpages-assets/js/include.js"></script>
</body>
</html>
