<header class="app-header" id="appHeader">
  <div class="header-inner">
    <!-- Left: location -->
    <button class="header-location" type="button" aria-label="城市选择">
      <svg class="icon-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
        <circle cx="12" cy="10" r="3"/>
      </svg>
      <span>纽约</span>
      <svg class="icon-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <!-- Center: logo -->
    <a href="https://openaa.com" class="header-logo" aria-label="OpenAA 首页">
      <img src="/assets/logo.png" alt="OpenAA" class="header-logo-img" onerror="this.style.display='none'" />
      <span class="header-logo-text">
        <span class="logo-blue">Open</span><span class="logo-dark">AA</span>
      </span>
    </a>

    <!-- Right: share -->
    <button class="header-share" type="button" aria-label="分享" onclick="shareOpenAA()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/>
        <circle cx="6" cy="12" r="3"/>
        <circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
    </button>
  </div>
</header>

<!-- Header spacer -->
<div class="header-spacer"></div>
