<!-- 2. 主 Banner 广告轮播 -->
<section class="banner-section">
  <div class="banner-wrapper">
    <div class="banner-track" id="bannerTrack"></div>
    <div class="banner-dots" id="bannerDots"></div>
  </div>
</section>

<!-- 3. 搜索框 (Google Search) -->
<section class="search-section">
  <form class="search-wrapper" action="https://www.google.com/search" method="GET" target="_self" rel="noopener" onsubmit="return handleGoogleSearchSubmit(event)">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input
      type="search"
      id="searchInput"
      name="q"
      class="search-input"
      placeholder="华人OpenAA 搜索你感兴趣的内容..."
      autocomplete="off"
    />
    <button class="search-clear" id="searchClear" type="button" onclick="clearGoogleSearch()" aria-label="清除搜索">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
    <button class="search-submit" type="submit" aria-label="搜索">搜索</button>
  </form>
</section>

<!-- 5. 分类吸顶栏 -->
<div class="category-bar-wrap" id="categoryBarWrap">
  <div class="category-bar-inner">
    <!-- 固定在左侧的"全部"按钮 -->
    <div class="cat-pin-area">
      <button class="cat-tab active" id="catTabAll" data-cat="all" role="tab" aria-selected="true" onclick="switchCategory('all', this)">返回</button>
    </div>
    <!-- 右侧横向可滑动的分类 -->
    <nav class="category-bar" id="categoryBar" role="tablist">
      <button class="cat-tab" data-cat="featured" role="tab" aria-selected="false" onclick="switchCategory('featured', this)">推荐</button>
      <button class="cat-tab" data-cat="gov" role="tab" aria-selected="false" onclick="switchCategory('gov', this)">政府</button>
      <button class="cat-tab" data-cat="bank" role="tab" aria-selected="false" onclick="switchCategory('bank', this)">银行</button>

      <button class="cat-tab" data-cat="dmv" role="tab" aria-selected="false" onclick="switchCategory('dmv', this)">DMV</button>
      <button class="cat-tab" data-cat="tools" role="tab" aria-selected="false" onclick="switchCategory('tools', this)">工具</button>
      <button class="cat-tab" data-cat="ai" role="tab" aria-selected="false" onclick="switchCategory('ai', this)">常用AI</button>
      <button class="cat-tab" data-cat="map" role="tab" aria-selected="false" onclick="switchCategory('map', this)">地图</button>
      <button class="cat-tab" data-cat="post" role="tab" aria-selected="false" onclick="switchCategory('post', this)">邮政</button>
